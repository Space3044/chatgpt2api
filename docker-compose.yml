services:
  app:
    image: ${CHATGPT2API_IMAGE:-ghcr.io/yukkcat/chatgpt2api:latest}
    container_name: chatgpt2api
    restart: unless-stopped
    ports:
      - "${CHATGPT2API_PORT:-3000}:80"
    volumes:
      - chatgpt2api-runtime:/app
      - ./data:/app/data
      - ./config.json:/app/config.json
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      CHATGPT2API_AUTH_KEY: ${CHATGPT2API_AUTH_KEY:-}
      CHATGPT2API_BASE_URL: ${CHATGPT2API_BASE_URL:-}
      CHATGPT2API_THREAD_TOKENS: ${CHATGPT2API_THREAD_TOKENS:-120}
      # Voice input (cometix-asr sidecar). COMETIX_APP_KEY has no default
      # anywhere in the repo: set it in .env on the VPS. Live transcription
      # works without it; only RunPostAsr (fmt + NER) needs it.
      COMETIX_APP_KEY: ${COMETIX_APP_KEY:-}
      COMETIX_APP_ID: ${COMETIX_APP_ID:-401734}
      # Optional shared key between the Python backend and the sidecar
      # (loopback only). Leave unset to rely on loopback binding alone.
      ASR_SIDECAR_KEY: ${ASR_SIDECAR_KEY:-}
      TZ: ${TZ:-Asia/Shanghai}

volumes:
  chatgpt2api-runtime:
